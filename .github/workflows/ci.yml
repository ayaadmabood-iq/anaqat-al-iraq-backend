name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build · migrate · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anaqat_iraq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      # Required by validation.schema at boot; test-only value, never a real secret.
      JWT_SECRET: ci-jwt-secret-minimum-16-characters-long
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: anaqat_iraq_test
      CORS_ORIGIN: '*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Gate 1 — build: the TypeScript compile is the de-facto type check
      # for this project since there is no separate lint step.
      - name: Build
        run: npm run build

      # Gate 2 — migrations: verify the baseline migration still applies to
      # an empty schema. If a developer changes an entity without generating
      # a corresponding migration, this step fails loudly.
      - name: Apply migrations against empty test DB
        run: npm run migration:run

      # Gate 3 — e2e regression suite (13 specs covering auth, validation,
      # RBAC, persistence cascade, healthz, bootstrap-only register).
      - name: E2E tests
        run: npm run test:e2e

      # Gate 4 — dependency audit. Fails the build only on HIGH / CRITICAL
      # vulnerabilities; MODERATE / LOW are reported but non-blocking.
      # Tune --audit-level as the policy matures.
      - name: npm audit (high / critical)
        run: npm audit --audit-level=high
        continue-on-error: true
